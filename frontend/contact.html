<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Nordis</title>
<meta name="description" content="Contact Nordis.">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="hero page-hero"><div class="container"><p class="eyebrow">Contact</p><h1>Contact us</h1><p>Send a message and we will reply within two working days.</p></div></section><section class="section"><div class="container"><form id="contact-form" class="form" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name"><div class="error" data-error="name"></div></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><div class="error" data-error="email"></div></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6"></textarea><div class="error" data-error="message"></div></div>
<button class="btn btn-primary" type="submit">Send message</button>
<p id="form-status" class="status" role="status"></p>
</form></div></section>
</main>
<footer id="site-footer"></footer>
<script src="/js/main.js"></script>
</body>
</html>
